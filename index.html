<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>M-PESA Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #101010;
      color: #fff;
      min-height: 100vh;
    }

    button,
    a {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */

    .header {
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #35b84a;
    }

    .menu {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #242424;
      color: white;
      font-size: 22px;
    }

    /* MAIN */

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 15px 18px 100px;
    }

    /* BALANCE */

    .balance-card {
      background: #202020;
      border-radius: 25px;
      padding: 25px 20px;
      min-height: 170px;
      border-left: 4px solid #32b44a;
      margin-bottom: 28px;
    }

    .balance-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #bdbdbd;
      font-size: 14px;
    }

    .eye {
      border: 0;
      background: transparent;
      font-size: 20px;
    }

    .balance {
      margin-top: 14px;
      font-size: 34px;
      font-weight: 700;
    }

    .balance-label {
      margin-top: 15px;
      color: #999;
      font-size: 13px;
    }

    /* SECTION */

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .section-title h2 {
      font-size: 21px;
    }

    .view-all {
      background: transparent;
      border: 0;
      color: #aaa;
      font-size: 13px;
    }

    /* QUICK ACTIONS */

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .quick-action {
      min-height: 105px;
      border-radius: 16px;
      background: #202020;
      border: 1px solid #292929;
      color: white;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: .2s;
    }

    .quick-action:active {
      transform: scale(.96);
    }

    .quick-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .quick-action span {
      font-size: 12px;
      text-align: center;
    }

    /* FREQUENTS */

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 17px;
    }

    .tab {
      border: 0;
      background: #242424;
      color: #aaa;
      padding: 9px 17px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .tab.active {
      background: #35b84a;
      color: white;
    }

    .frequents {
      display: flex;
      gap: 20px;
      overflow-x: auto;
    }

    .person {
      min-width: 60px;
      text-align: center;
      color: #ccc;
      font-size: 12px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      margin: auto auto 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #333;
      border: 1px solid #444;
      font-size: 18px;
      color: white;
    }

    .add {
      color: #35b84a;
      font-size: 28px;
    }

    /* DEAL */

    .deal {
      background: linear-gradient(135deg, #202020, #292929);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid #333;
    }

    .deal-small {
      color: #35b84a;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .deal h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .deal p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 17px;
    }

    .deal button {
      border: 0;
      background: #35b84a;
      color: white;
      border-radius: 20px;
      padding: 10px 18px;
      font-weight: bold;
    }

    /* FINANCES */

    .finances {
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .finance {
      min-width: 170px;
      background: #202020;
      border-radius: 17px;
      padding: 17px;
    }

    .finance-icon {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .finance strong {
      display: block;
      margin-bottom: 5px;
    }

    .finance small {
      color: #999;
    }

    /* SCAN */

    .scan {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      border: 0;
      border-radius: 30px;
      background: #35b84a;
      color: white;
      padding: 15px 24px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(0,0,0,.5);
      z-index: 10;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      z-index: 20;
      font-size: 14px;
    }

    .toast.show {
      display: block;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      .header {
        height: 62px;
      }

      .container {
        padding-left: 14px;
        padding-right: 14px;
      }

      .balance {
        font-size: 30px;
      }

      .quick-actions {
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }

      .quick-action {
        min-height: 90px;
        border-radius: 13px;
      }

      .quick-icon {
        width: 39px;
        height: 39px;
        font-size: 19px;
      }

      .quick-action span {
        font-size: 10px;
      }

      .deal h2 {
        font-size: 20px;
      }
    }

    @media (max-width: 360px) {

      .quick-actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .quick-action {
        min-height: 90px;
      }
    }
  </style>
</head>
